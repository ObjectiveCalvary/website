<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#40654a">
<title>Anchor Main Menu</title>
<link rel="icon" href="../images/OC_64px.png" sizes="48x48">
<style>
:root{
  --gold:#ffbd59; --gold-hi:#ffe27a; --gold-lo:#b57d00;
  --green:#40654a; --green-dk:#2f4c37; --ink:#1b1440;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
body{background:var(--green);min-height:100dvh}

#menuBg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}

.home{position:relative;z-index:1;min-height:100dvh;max-width:420px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom))}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}
.logo-wrap{position:relative;width:min(72%,250px)}
.logo{width:100%;max-height:32dvh;object-fit:contain;display:block;pointer-events:none;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.3));animation:float 4.2s ease-in-out infinite}

.title{margin:22px 0 0;font:700 clamp(44px,14vw,58px)/1 Arial,Helvetica,sans-serif;letter-spacing:.02em;
  color:var(--gold);text-shadow:0 2px 0 rgba(120,70,0,.35),0 2px 14px rgba(0,0,0,.35)}
.sub{margin:6px 0 0;font-size:13px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.45)}

/* ---- Back button (top-left, rectangular) ---- */
.back{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:5;padding:9px 16px;border:0;border-radius:4px;
  background:#fff;color:var(--ink);font-family:inherit;font-weight:900;font-size:13px;line-height:1;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;box-shadow:0 3px 0 rgba(20,14,60,.25),0 6px 14px rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s}
.back:hover{transform:translateY(-1px)}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(20,14,60,.25)}
.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---- Watch Trailer (small white rectangle, under + right of title) ---- */
.trailer-row{width:100%;display:flex;justify-content:flex-end;margin-top:10px}
.trailer-btn{display:inline-block;padding:7px 14px;border-radius:4px;background:#fff;color:var(--ink);text-decoration:none;
  font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  box-shadow:0 3px 0 rgba(20,14,60,.25),0 6px 14px rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s}
.trailer-btn:hover{transform:translateY(-1px)}
.trailer-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(20,14,60,.25)}
.trailer-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---- "Coming Soon" popup ---- */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(15,10,40,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-card{width:100%;max-width:340px;padding:26px 22px 22px;border-radius:16px;background:#fff;color:var(--ink);text-align:center;
  box-shadow:0 6px 0 rgba(20,14,60,.25),0 20px 50px rgba(0,0,0,.4);animation:pop .22s ease-out}
.modal-card h2{margin:0 0 10px;font:900 26px/1.1 Arial,Helvetica,sans-serif;letter-spacing:.04em;color:#2b1766}
.modal-card p{margin:0 0 20px;font-size:15px;font-weight:700;line-height:1.45}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}

/* ---- Link buttons ---- */
.links{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:10px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;text-align:center;text-decoration:none;
  font-size:18px;font-weight:900;letter-spacing:.14em;color:var(--ink);background:#fff;
  box-shadow:0 4px 0 rgba(20,14,60,.25),0 8px 20px rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(20,14,60,.25)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.primary{font-size:20px;color:#2b1766;background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  box-shadow:0 5px 0 var(--gold-lo),0 10px 24px rgba(255,207,74,.35)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-lo)}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.logo,.modal-card{animation:none}}


/* ---- Adaptations for the Anchor menu ---- */
.sub{margin:6px 0 0;text-align:center}
.menu-btn{font-family:inherit;border:0;cursor:pointer;appearance:none;-webkit-appearance:none}
/* All four main-menu buttons share the same gold look, size and font */
.links .btn{font-family:inherit;font-size:20px;font-weight:900;border:0;cursor:pointer;color:#2b1766;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));
  box-shadow:0 5px 0 var(--gold-lo),0 10px 24px rgba(255,207,74,.35)}
.links .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-lo)}
.menu-btn.charging{transition:none !important;animation:none !important}
.divider{width:100%;max-width:300px;margin:0 auto;display:flex;align-items:center;gap:10px}
.credit{margin:6px 0 0;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.45);text-align:center}

</style>
</head>
<body>
<canvas id="menuBg" aria-hidden="true"></canvas>

<button class="back" type="button" onclick="window.location.href='Anchor.html'">Back</button>

<main class="home">
  <section class="hero">
    <div class="logo-wrap">
      <img class="logo" src="../images/Anchor_64px.png" alt="Anchor logo" draggable="false">
    </div>

    <h1 class="title">Anchor</h1>
    <div class="trailer-row">
      <a class="trailer-btn" href="https://youtu.be/AeiPA2uMesg?cc_load_policy=0" target="_blank" rel="noopener noreferrer">Watch Trailer</a>
    </div>
  </section>

  <!-- Menu buttons (data-href + btn-* classes drive the explosion transitions) -->
  <nav class="links" aria-label="Main menu">
    <button class="menu-btn btn primary btn-game" data-href="Anchor_GameRules.html">Instruction Guide</button>

    <!-- <button class="menu-btn btn btn-discipleship" data-href="Anchor_Discipleship.html">Discipleship</button> -->
    <!-- <button class="menu-btn btn btn-devotional" data-href="Anchor_BibleStudy.html">Bible Study</button> -->
    <button class="btn" id="arenaBtn" type="button">Arena Mode</button>

    <button class="btn" onclick="window.location.href='Anchor.html'">Details</button>

  </nav>

</main>

<!-- Anchor Arena popup -->
<div class="modal" id="arenaModal" role="dialog" aria-modal="true" aria-labelledby="arenaTitle">
  <div class="modal-card">
    <h2 id="arenaTitle">Coming Soon</h2>
    <p>We are currently beta testing the Digital Anchor Journey Game.</p>
    <button class="btn primary" id="arenaClose" type="button">OK</button>
  </div>
</div>

<script>
(function () {
  const modal = document.getElementById('arenaModal');
  const open  = () => { modal.classList.add('open'); document.getElementById('arenaClose').focus(); };
  const close = () => modal.classList.remove('open');
  document.getElementById('arenaBtn').addEventListener('click', open);
  document.getElementById('arenaClose').addEventListener('click', close);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();
</script>

<script>
/* Animated colour-wave background (same palette and motion as the original menu) */
(function () {
  const cv = document.getElementById('menuBg'), cx = cv.getContext('2d');
  const stops = [[0,'#40654a'],[9,'#d6b027'],[18,'#903e62'],[22,'#ed9e71'],[27,'#258fa2'],[30,'#bd444c'],[37,'#cf8404'],
    [42,'#374ca6'],[56,'#858bd8'],[65,'#937573'],[70,'#f8d06c'],[77,'#a273a2'],[82,'#70af81'],[88,'#7b98bd'],
    [96,'#eb8a18'],[101,'#006484'],[107,'#8f2b58'],[119,'#bd642b'],[129,'#7d92e6'],[137,'#d4ac75'],[141,'#db4c61'],[150,'#fdbd50']];
  const total = stops[stops.length - 1][0] + 20;
  const looped = stops.concat([[total, stops[0][1]]]);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  function colorAt(time) {
    const f = time % total;
    let i = 0;
    for (let k = 0; k < looped.length - 1; k++) if (f >= looped[k][0] && f < looped[k + 1][0]) { i = k; break; }
    const [f0, c0] = looped[i], [f1, c1] = looped[i + 1];
    const r = clamp((f - f0) / (f1 - f0), 0, 1), t = r * r * (3 - 2 * r);
    const a = rgb(c0), b = rgb(c1);
    return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
  }
  const waves = [
    { speed: 0.0030, amp: 28, xFrac: 0.15, offset: 9,  phase: 0.0 },
    { speed: 0.0045, amp: 22, xFrac: 0.30, offset: 25, phase: 2.1 },
    { speed: 0.0025, amp: 34, xFrac: 0.45, offset: 42, phase: 4.2 },
    { speed: 0.0050, amp: 20, xFrac: 0.60, offset: 60, phase: 1.0 },
    { speed: 0.0035, amp: 30, xFrac: 0.75, offset: 77, phase: 3.1 },
    { speed: 0.0040, amp: 24, xFrac: 0.90, offset: 94, phase: 5.2 }
  ].sort((a, b) => b.xFrac - a.xFrac);
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() { cv.width = window.innerWidth; cv.height = window.innerHeight; if (still) draw(0); }
  function draw(ts) {
    if (!still) requestAnimationFrame(draw);
    if (document.hidden) return;
    const t = ts * 0.001, ft = (t * 3) % total, W = cv.width, H = cv.height;
    cx.fillStyle = colorAt(ft); cx.fillRect(0, 0, W, H);
    waves.forEach(w => {
      const x0 = w.xFrac * W;
      cx.beginPath();
      for (let i = 0; i <= 140; i++) {
        const y = (i / 140) * H;
        const x = x0 + Math.sin(y * 0.006 + t * w.speed * 100 + w.phase) * w.amp
                     + Math.sin(y * 0.012 + t * w.speed * 60 + w.phase * 1.5) * (w.amp * 0.4);
        i ? cx.lineTo(x, y) : cx.moveTo(x, y);
      }
      cx.lineTo(0, H); cx.lineTo(0, 0); cx.closePath();
      cx.fillStyle = colorAt(ft + w.offset); cx.fill();
    });
  }
  size(); window.addEventListener('resize', size);
  if (!still) requestAnimationFrame(draw);
})();
</script>

<script>
/* ════════════════════════════════════════════════
   TAP → SHAKE → CARD EXPLOSION → NAVIGATE
   ════════════════════════════════════════════════ */
(function(){

  const PALETTE = [
    '#ffbd59','#f8d06c','#ed9e71','#eb8a18','#d6b027',
    '#70af81','#40654a','#258fa2','#006484','#7b98bd',
    '#374ca6','#7d92e6','#858bd8','#a273a2','#903e62',
    '#8f2b58','#bd444c','#db4c61','#cf8404','#d4ac75'
  ];
  const COVER_PALETTE = [
    '#ffbd59','#258fa2','#903e62','#70af81',
    '#374ca6','#ed9e71','#858bd8','#d6b027',
    '#bd444c','#40654a','#a273a2','#006484',
    '#db4c61','#7d92e6','#cf8404','#8f2b58',
  ];

  function hexToRgb(h){
    if(h && h.startsWith('rgb')){
      const m = h.match(/\d+/g);
      return m ? [+m[0],+m[1],+m[2]] : [0,0,0];
    }
    return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function lerpCol(a,b,t){
    const ra=hexToRgb(a), rb=hexToRgb(b);
    return `rgb(${Math.round(lerp(ra[0],rb[0],t))},${Math.round(lerp(ra[1],rb[1],t))},${Math.round(lerp(ra[2],rb[2],t))})`;
  }

  const CHARGE_MS = 1400;

  /* ── Sound effects ── */
  /* Place your audio files at these paths relative to this HTML file */
  const SFX_CHARGE     = '../sounds/charge.mp3';     /* 1.4 s — power building */
  const SFX_TRANSITION = '../sounds/transition.mp3'; /* 3.0 s — card explosion  */

  function loadAudio(src){
    const a = new Audio(src);
    a.preload = 'auto';
    return a;
  }
  const sfxCharge     = loadAudio(SFX_CHARGE);
  const sfxTransition = loadAudio(SFX_TRANSITION);

  function playSound(audio){
    try { audio.currentTime = 0; audio.play().catch(()=>{}); } catch(e){}
  }

  document.querySelectorAll('.menu-btn').forEach(btn => {
    let busy = false;

    function fire(e){
      e.preventDefault();
      if(busy) return;
      busy = true;

      // Lock in button position and href BEFORE anything changes the DOM
      const rect = btn.getBoundingClientRect();
      const OX   = rect.left + rect.width  / 2;
      const OY   = rect.top  + rect.height / 2;
      const dest = btn.getAttribute('data-href');  // read with getAttribute, not dataset

      // Determine animation style from button class
      let animStyle = 'sweep'; // default: Game Rules
      if(btn.classList.contains('btn-discipleship')) animStyle = 'starburst';
      if(btn.classList.contains('btn-devotional'))   animStyle = 'cascade';

      btn.classList.add('charging');
      btn.style.animation = 'none';
      playSound(sfxCharge);

      const start = performance.now();
      let palIdx = 0, colPhase = 0, lastCol = PALETTE[0];

      function chargeFrame(now){
        const progress = Math.min((now - start) / CHARGE_MS, 1);

        const speed = 0.12 + progress * 0.55;
        colPhase += speed;
        if(colPhase >= 1){ colPhase -= 1; palIdx = (palIdx+1) % PALETTE.length; }
        lastCol = lerpCol(PALETTE[palIdx], PALETTE[(palIdx+1) % PALETTE.length], colPhase);

        btn.style.background = lastCol; /* shorthand so it overrides the gold gradient */
        const glow = 12 + progress * 70;
        const spread = Math.round(progress * 18);
        btn.style.boxShadow = `0 4px 0 rgba(0,0,0,0.18),0 0 ${glow}px ${spread}px ${lastCol}ee,0 0 ${glow*2}px ${spread}px ${lastCol}55,inset 0 1px 0 rgba(255,255,255,0.4)`;

        const p2 = Math.max(0,(progress-0.2)/0.8);
        const sx = (Math.random()-0.5)*p2*22;
        const sy = (Math.random()-0.5)*p2*22;
        const rot = (Math.random()-0.5)*p2*8;
        const sc  = 1+progress*0.09;
        btn.style.transform = `translate(${sx}px,${sy}px) rotate(${rot}deg) scale(${sc})`;

        if(progress < 1){
          requestAnimationFrame(chargeFrame);
        } else {
          btn.style.transform = 'scale(1.1)';
          btn.style.opacity   = '0';
          playSound(sfxTransition);
          domExplode(lastCol, dest, OX, OY, animStyle);
        }
      }
      requestAnimationFrame(chargeFrame);
    }

    btn.addEventListener('click',      fire);
    btn.addEventListener('touchstart', fire, {passive:false});
  });

  /* Shared navigate helper — colors the <html> element so the
     background persists through DOM teardown and into the next page
     paint, eliminating the white flash between pages.              */
  function navigateTo(dest, color){
    if(!dest) return;
    const s = document.createElement('style');
    s.textContent = `html,body{background:${color} !important;}`;
    document.head.appendChild(s);
    window.location.href = dest;
  }

  /* ══════════════════════════════════════
     CARD + COLOUR EXPLOSION → NAVIGATE
  ══════════════════════════════════════ */
  function domExplode(triggerColor, dest, OX, OY, animStyle){
    if(animStyle === 'starburst') return domExplodeStarburst(triggerColor, dest, OX, OY);
    if(animStyle === 'cascade')   return domExplodeCascade(triggerColor, dest, OX, OY);
    return domExpodeSweep(triggerColor, dest, OX, OY);
  }

  /* ─── GAME RULES: original horizontal sweep ─── */
  function domExpodeSweep(triggerColor, dest, OX, OY){
    const W = window.innerWidth, H = window.innerHeight;

    /* ── Colour cover behind everything ── */
    const cover = document.createElement('div');
    cover.style.cssText = `position:fixed;inset:0;z-index:9000;pointer-events:none;background:${triggerColor};opacity:0;transition:opacity 0.12s ease-out;`;
    document.body.appendChild(cover);
    cover.getBoundingClientRect(); // force reflow
    cover.style.opacity = '1';

    let cpIdx = 0, cpPhase = 0;
    function cycleCover(){
      cpPhase += 0.005; /* was 0.028 — much calmer now */
      if(cpPhase >= 1){ cpPhase -= 1; cpIdx = (cpIdx+1) % COVER_PALETTE.length; }
      cover.style.background = lerpCol(COVER_PALETTE[cpIdx], COVER_PALETTE[(cpIdx+1)%COVER_PALETTE.length], cpPhase);
    }

    /* ── Card burst: small cards scattered across the screen, behind the sweepers ── */
    function launchBurst(){
      const burstCount = 18 + Math.floor(Math.random() * 8); // 18–25 cards
      const burstPool = pool.slice(numSpotlight, numSpotlight + burstCount);

      burstPool.forEach((num, i) => {
        /* Random start position anywhere on screen */
        const BCARD_W  = 52 + Math.random() * 38;  // 52–90 px wide
        const BCARD_H  = BCARD_W * 1.41;
        const startX   = Math.random() * W;
        const startY   = Math.random() * H;

        /* Drift in a random direction, modest distance */
        const angle    = Math.random() * Math.PI * 2;
        const dist     = 80 + Math.random() * 160;
        const tx       = Math.cos(angle) * dist;
        const ty       = Math.sin(angle) * dist;

        const delay    = Math.random() * 400;
        const FLIGHT   = 2500 + Math.random() * 1000;  // 2.5–3.5 s
        const spin     = (Math.random() - 0.5) * 180;
        const startRot = (Math.random() - 0.5) * 30;

        const el = document.createElement('div');
        el.style.cssText = `
          position:fixed;
          left:${startX - BCARD_W/2}px;
          top:${startY - BCARD_H/2}px;
          width:${BCARD_W}px;height:${BCARD_H}px;
          border-radius:10px;
          overflow:hidden;
          box-shadow:0 6px 22px rgba(0,0,0,0.45),0 2px 6px rgba(0,0,0,0.3);
          z-index:9005;
          pointer-events:none;
          opacity:0;
          will-change:transform,opacity;
          transform:rotate(${startRot}deg);
        `;

        const img = document.createElement('img');
        img.src = `../images/cards/${num}.png`;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
        img.onerror = () => { el.style.background = COVER_PALETTE[num % COVER_PALETTE.length]; img.remove(); };
        el.appendChild(img);
        document.body.appendChild(el);

        let t0 = null;
        function anim(now){
          if(!t0) t0 = now;
          const t  = Math.min((now - t0) / FLIGHT, 1);
          const te = 1 - Math.pow(1 - t, 2.5); // ease-out

          el.style.transform = `translate(${tx*te}px,${ty*te}px) rotate(${startRot + spin*te}deg)`;
          /* fade in, linger, fade out gently */
          const op = t < 0.10 ? t/0.10 : t > 0.75 ? 1-(t-0.75)/0.25 : 1;
          el.style.opacity = op * 0.82;

          if(t < 1) requestAnimationFrame(anim);
          else el.remove();
        }
        setTimeout(() => requestAnimationFrame(anim), delay);
      });
    }

    /* ── Shuffle card pool ── */
    const pool = Array.from({length:150},(_,i)=>i+1);
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]; }

    /* ── Random 3–5 spotlight cards ── */
    const numSpotlight = 3 + Math.floor(Math.random() * 3); // 3, 4, or 5
    const spotlightCards = pool.slice(0, numSpotlight);

    /* ── Launch burst now that pool + numSpotlight are defined ── */
    launchBurst();

    const BASE_W = Math.min(105, W * 0.20);

    function launchCard(num, delay){
      const CARD_W = BASE_W * 3.2;
      const CARD_H = CARD_W * 1.41;
      const FLIGHT_MS = 2800 + Math.random() * 500;

      const fromLeft = Math.random() < 0.5;
      const startX = fromLeft ? -CARD_W : W + CARD_W;
      const startY = H * (0.12 + Math.random() * 0.72);
      const vx = fromLeft ? W + CARD_W * 2 : -(W + CARD_W * 2);
      const vy = (Math.random()-0.5) * H * 0.28;

      const spin     = (Math.random()-0.5) * 7;
      const startRot = (Math.random()-0.5) * 18;

      const el = document.createElement('div');
      el.style.cssText = `
        position:fixed;
        left:${startX - CARD_W/2}px;
        top:${startY - CARD_H/2}px;
        width:${CARD_W}px;height:${CARD_H}px;
        border-radius:22px;
        overflow:hidden;
        box-shadow:0 16px 60px rgba(0,0,0,0.6),0 4px 12px rgba(0,0,0,0.4);
        z-index:9010;
        pointer-events:none;
        opacity:0;
        will-change:transform,opacity;
        transform:rotate(${startRot}deg);
      `;

      const img = document.createElement('img');
      img.src = `../images/cards/${num}.png`;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      img.onerror = () => { el.style.background = COVER_PALETTE[num % COVER_PALETTE.length]; img.remove(); };
      el.appendChild(img);
      document.body.appendChild(el);

      let t0 = null;
      function anim(now){
        if(!t0) t0 = now;
        const t  = Math.min((now-t0)/FLIGHT_MS, 1);
        const te = 1 - Math.pow(1-t, 3); // ease-out cubic

        const x  = vx * te;
        const y  = vy * te;
        const rot = startRot + spin * te;
        const op = t < 0.06 ? t/0.06 : t > 0.88 ? 1-(t-0.88)/0.12 : 1;

        el.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg)`;
        el.style.opacity   = op;

        if(t < 1) requestAnimationFrame(anim);
        else el.remove();
      }
      setTimeout(() => requestAnimationFrame(anim), delay);

      return delay + FLIGHT_MS; // return when this card finishes
    }

    /* Stagger spotlight cards; track when the last one ends */
    let lastFinish = 0;
    spotlightCards.forEach((num, i) => {
      const delay = i * 380;
      const finish = launchCard(num, delay);
      if(finish > lastFinish) lastFinish = finish;
    });

    /* Navigate as the last card begins its fade-out (at 88% of its flight) */
    const TOTAL_MS = Math.round(lastFinish * 0.88);

    /* ── Colour cycle loop ── */
    const explodeStart = performance.now();
    function colorLoop(now){
      if(now - explodeStart < TOTAL_MS){ cycleCover(); requestAnimationFrame(colorLoop); }
    }
    requestAnimationFrame(colorLoop);

    /* ── Navigate with html bg locked to cover color — no flash ── */
    setTimeout(() => { navigateTo(dest, cover.style.background || triggerColor); }, TOTAL_MS);
  } /* end domExpodeSweep */

  /* ══════════════════════════════════════════════════════
     DISCIPLESHIP: diagonal cross — large cards fly in from
     all four corners on diagonal paths, crossing the full
     screen. Same feel as sweep and cascade but the travel
     direction cuts corner-to-corner instead of side-to-side
     or top-to-bottom, giving it its own distinct character.
  ══════════════════════════════════════════════════════ */
  function domExplodeStarburst(triggerColor, dest, OX, OY){
    const W = window.innerWidth, H = window.innerHeight;

    /* ── Colour cover ── */
    const cover = document.createElement('div');
    cover.style.cssText = `position:fixed;inset:0;z-index:9000;pointer-events:none;background:${triggerColor};opacity:0;transition:opacity 0.12s ease-out;`;
    document.body.appendChild(cover);
    cover.getBoundingClientRect();
    cover.style.opacity = '1';

    let cpIdx = 0, cpPhase = 0;
    function cycleCover(){
      cpPhase += 0.005;
      if(cpPhase >= 1){ cpPhase -= 1; cpIdx = (cpIdx+1) % COVER_PALETTE.length; }
      cover.style.background = lerpCol(COVER_PALETTE[cpIdx], COVER_PALETTE[(cpIdx+1)%COVER_PALETTE.length], cpPhase);
    }

    /* ── Shuffle pool ── */
    const pool = Array.from({length:150},(_,i)=>i+1);
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]; }

    /* ── Small burst cards — same as sweep ── */
    const burstCount = 18 + Math.floor(Math.random() * 8);
    pool.slice(0, burstCount).forEach((num, i) => {
      const BW = 52 + Math.random() * 38, BH = BW * 1.41;
      const startX = Math.random() * W, startY = Math.random() * H;
      const angle  = Math.random() * Math.PI * 2;
      const dist   = 80 + Math.random() * 160;
      const tx = Math.cos(angle) * dist, ty = Math.sin(angle) * dist;
      const delay  = Math.random() * 400, FLIGHT = 2500 + Math.random() * 1000;
      const spin   = (Math.random()-0.5) * 180, startRot = (Math.random()-0.5) * 30;

      const el = document.createElement('div');
      el.style.cssText = `position:fixed;left:${startX-BW/2}px;top:${startY-BH/2}px;width:${BW}px;height:${BH}px;border-radius:10px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,0.45);z-index:9005;pointer-events:none;opacity:0;will-change:transform,opacity;transform:rotate(${startRot}deg);`;
      const img = document.createElement('img');
      img.src = `../images/cards/${num}.png`;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      img.onerror = () => { el.style.background = COVER_PALETTE[num % COVER_PALETTE.length]; img.remove(); };
      el.appendChild(img); document.body.appendChild(el);
      let t0=null;
      function animB(now){ if(!t0)t0=now; const t=Math.min((now-t0)/FLIGHT,1),te=1-Math.pow(1-t,2.5); el.style.transform=`translate(${tx*te}px,${ty*te}px) rotate(${startRot+spin*te}deg)`; el.style.opacity=t<0.10?t/0.10:t>0.75?1-(t-0.75)/0.25:1; if(t<1)requestAnimationFrame(animB); else el.remove(); }
      setTimeout(()=>requestAnimationFrame(animB), delay);
    });

    /* ── Four corner origins — one diagonal path per corner ── */
    const D = Math.sqrt(W*W + H*H); /* full diagonal distance */
    const corners = [
      { sx: -1, sy: -1 },  /* top-left     → bottom-right */
      { sx:  1, sy: -1 },  /* top-right    → bottom-left  */
      { sx: -1, sy:  1 },  /* bottom-left  → top-right    */
      { sx:  1, sy:  1 },  /* bottom-right → top-left     */
    ];

    const BASE_W = Math.min(105, W * 0.20);
    const CARD_W = BASE_W * 3.2;
    const CARD_H = CARD_W * 1.41;
    const numSpotlight = 3 + Math.floor(Math.random() * 3); /* 3–5 */
    let lastFinish = 0;

    pool.slice(burstCount, burstCount + numSpotlight).forEach((num, i) => {
      /* Cycle through corners so cards come from different directions */
      const corner = corners[i % corners.length];

      /* Start just off the corner of the screen */
      const startX = corner.sx < 0 ? -CARD_W : W + CARD_W;
      const startY = corner.sy < 0 ? -CARD_H  : H + CARD_H;

      /* Travel the full diagonal plus a bit more to exit the opposite side */
      const vx = -corner.sx * (W + CARD_W * 2);
      const vy = -corner.sy * (H + CARD_H * 2);

      /* Slight random offset so cards don't all share exactly the same path */
      const jitterX = (Math.random()-0.5) * W * 0.18;
      const jitterY = (Math.random()-0.5) * H * 0.18;

      const FLIGHT_MS = 2600 + Math.random() * 600;
      const delay     = i * 320;
      const spin      = (Math.random()-0.5) * 8;
      const startRot  = (Math.random()-0.5) * 16;

      const el = document.createElement('div');
      el.style.cssText = `
        position:fixed;
        left:${startX + jitterX - CARD_W/2}px;
        top:${startY + jitterY - CARD_H/2}px;
        width:${CARD_W}px;height:${CARD_H}px;
        border-radius:22px;overflow:hidden;
        box-shadow:0 16px 60px rgba(0,0,0,0.6),0 4px 12px rgba(0,0,0,0.4);
        z-index:9010;pointer-events:none;opacity:0;
        will-change:transform,opacity;
        transform:rotate(${startRot}deg);
      `;
      const img = document.createElement('img');
      img.src = `../images/cards/${num}.png`;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      img.onerror = () => { el.style.background = COVER_PALETTE[num % COVER_PALETTE.length]; img.remove(); };
      el.appendChild(img);
      document.body.appendChild(el);

      let t0 = null;
      function anim(now){
        if(!t0) t0 = now;
        const t  = Math.min((now-t0)/FLIGHT_MS, 1);
        const te = 1 - Math.pow(1-t, 3); /* ease-out cubic — same as sweep */
        const op = t < 0.06 ? t/0.06 : t > 0.88 ? 1-(t-0.88)/0.12 : 1;
        el.style.transform = `translate(${vx*te}px,${vy*te}px) rotate(${startRot+spin*te}deg)`;
        el.style.opacity   = String(op);
        if(t < 1) requestAnimationFrame(anim);
        else el.remove();
      }
      setTimeout(() => requestAnimationFrame(anim), delay);

      const finish = delay + FLIGHT_MS;
      if(finish > lastFinish) lastFinish = finish;
    });

    const TOTAL_MS = Math.round(lastFinish * 0.88);

    const explodeStart = performance.now();
    function colorLoop(now){
      if(now - explodeStart < TOTAL_MS){ cycleCover(); requestAnimationFrame(colorLoop); }
    }
    requestAnimationFrame(colorLoop);

    setTimeout(() => { navigateTo(dest, cover.style.background || triggerColor); }, TOTAL_MS);
  } /* end domExplodeStarburst (diagonal-cross) */

  /* ══════════════════════════════════════════════════════
     BIBLE STUDY: cascade — cards rain down from the top
     of the screen in gentle offset columns, like pages
     falling from heaven, drifting with a soft lateral sway.
  ══════════════════════════════════════════════════════ */
  function domExplodeCascade(triggerColor, dest, OX, OY){
    const W = window.innerWidth, H = window.innerHeight;

    /* ── Colour cover ── */
    const cover = document.createElement('div');
    cover.style.cssText = `position:fixed;inset:0;z-index:9000;pointer-events:none;background:${triggerColor};opacity:0;transition:opacity 0.12s ease-out;`;
    document.body.appendChild(cover);
    cover.getBoundingClientRect();
    cover.style.opacity = '1';

    let cpIdx = 0, cpPhase = 0;
    function cycleCover(){
      cpPhase += 0.005;
      if(cpPhase >= 1){ cpPhase -= 1; cpIdx = (cpIdx+1) % COVER_PALETTE.length; }
      cover.style.background = lerpCol(COVER_PALETTE[cpIdx], COVER_PALETTE[(cpIdx+1)%COVER_PALETTE.length], cpPhase);
    }

    /* ── Shuffle pool ── */
    const pool = Array.from({length:150},(_,i)=>i+1);
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]; }

    /* ── Small cascade cards: rain from the top ── */
    const burstCount = 22 + Math.floor(Math.random() * 8);
    pool.slice(0, burstCount).forEach((num, i) => {
      const BCARD_W = 50 + Math.random() * 40;
      const BCARD_H = BCARD_W * 1.41;
      const startX = Math.random() * W;
      const startY = -BCARD_H - Math.random() * H * 0.2;
      /* Fall past the bottom edge so cards exit naturally */
      const ty = H + BCARD_H * 2.5;
      const tx = (Math.random()-0.5) * W * 0.25;
      const delay  = i * 60 + Math.random() * 80;
      const FLIGHT = 1600 + Math.random() * 700;
      const spin   = (Math.random()-0.5) * 90;
      const startRot = (Math.random()-0.5) * 20;

      const el = document.createElement('div');
      el.style.cssText = `
        position:fixed;
        left:${startX - BCARD_W/2}px;
        top:${startY}px;
        width:${BCARD_W}px;height:${BCARD_H}px;
        border-radius:10px;overflow:hidden;
        box-shadow:0 6px 22px rgba(0,0,0,0.45),0 2px 6px rgba(0,0,0,0.3);
        z-index:9005;pointer-events:none;opacity:0;
        will-change:transform,opacity;
        transform:rotate(${startRot}deg);
      `;
      const img = document.createElement('img');
      img.src = `../images/cards/${num}.png`;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      img.onerror = () => { el.style.background = COVER_PALETTE[num % COVER_PALETTE.length]; img.remove(); };
      el.appendChild(img);
      document.body.appendChild(el);

      let t0 = null;
      function anim(now){
        if(!t0) t0 = now;
        const t  = Math.min((now-t0)/FLIGHT, 1);
        const te = t * t; /* ease-in gravity */
        el.style.transform = `translate(${tx*t}px,${ty*te}px) rotate(${startRot+spin*t}deg)`;
        /* fade in only — no fade out, card exits off-screen naturally */
        const op = t < 0.06 ? t/0.06 : 1;
        el.style.opacity = op * 0.85;
        if(t < 1) requestAnimationFrame(anim);
        else el.remove();
      }
      setTimeout(() => requestAnimationFrame(anim), delay);
    });

    /* ── Spotlight cards: large, cascade with pendulum sway ── */
    const numSpotlight = 3 + Math.floor(Math.random() * 3);
    const BASE_W = Math.min(105, W * 0.20);
    const CARD_W = BASE_W * 3.2;
    const CARD_H = CARD_W * 1.41;
    let lastFinish = 0;

    pool.slice(burstCount, burstCount + numSpotlight).forEach((num, i) => {
      const laneX   = W * (0.15 + (i / Math.max(numSpotlight-1,1)) * 0.70);
      const startY  = -CARD_H;
      /* Fall well past the bottom so card is off-screen before navigate */
      const ty      = H + CARD_H * 2.5;
      const tx      = (Math.random()-0.5) * W * 0.18;
      const delay   = i * 260;
      const FLIGHT_MS = 1900 + Math.random() * 400;
      const spin    = (Math.random()-0.5) * 10;
      const startRot = (Math.random()-0.5) * 15;

      const el = document.createElement('div');
      el.style.cssText = `
        position:fixed;
        left:${laneX - CARD_W/2}px;
        top:${startY}px;
        width:${CARD_W}px;height:${CARD_H}px;
        border-radius:22px;overflow:hidden;
        box-shadow:0 16px 60px rgba(0,0,0,0.6),0 4px 12px rgba(0,0,0,0.4);
        z-index:9010;pointer-events:none;opacity:0;
        will-change:transform,opacity;
        transform:rotate(${startRot}deg);
      `;
      const img = document.createElement('img');
      img.src = `../images/cards/${num}.png`;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      img.onerror = () => { el.style.background = COVER_PALETTE[num % COVER_PALETTE.length]; img.remove(); };
      el.appendChild(img);
      document.body.appendChild(el);

      let t0 = null;
      function anim(now){
        if(!t0) t0 = now;
        const t  = Math.min((now-t0)/FLIGHT_MS, 1);
        const te = t * t; /* gravity ease-in */
        const sway = Math.sin(t * Math.PI * 1.5) * tx;
        el.style.transform = `translate(${sway}px,${ty*te}px) rotate(${startRot+spin*te}deg)`;
        /* fade in only — exits off-screen, no fade-out pop */
        const op = t < 0.06 ? t/0.06 : 1;
        el.style.opacity = op;
        if(t < 1) requestAnimationFrame(anim);
        else el.remove();
      }
      setTimeout(() => requestAnimationFrame(anim), delay);

      const finish = delay + FLIGHT_MS;
      if(finish > lastFinish) lastFinish = finish;
    });

    /* Navigate after all cards have physically exited + drain lerp window */
    const TOTAL_MS = lastFinish + 700;

    const explodeStart = performance.now();
    function colorLoop(now){
      if(now - explodeStart < TOTAL_MS){ cycleCover(); requestAnimationFrame(colorLoop); }
    }
    requestAnimationFrame(colorLoop);

    setTimeout(() => { navigateTo(dest, cover.style.background || triggerColor); }, TOTAL_MS);
  } /* end domExplodeCascade */

})();
</script>
